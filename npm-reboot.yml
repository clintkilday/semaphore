---
# Reboot managed VMs every second week, one at a time. Semaphore runs this
# weekly; odd ISO weeks are skipped so the cadence is fortnightly.
- name: Fortnightly reboot of managed VMs
  hosts: all
  serial: 1
  become: true
  gather_facts: false
  vars:
    iso_week: "{{ lookup('pipe', 'date +%V') | int }}"
    force_reboot: false
  tasks:
    - name: Skip on off-weeks
      ansible.builtin.meta: end_play
      when: (iso_week | int) is odd and not (force_reboot | bool)

    - name: Reboot and wait for SSH to return
      ansible.builtin.reboot:
        reboot_timeout: 900
        msg: "Scheduled fortnightly reboot via Semaphore"

    - name: Look for Docker
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_bin

    - name: Verify containers came back
      ansible.builtin.command: 'docker ps --format "{% raw %}{{.Names}} {{.Status}}{% endraw %}"'
      register: docker_ps
      changed_when: false
      retries: 6
      delay: 10
      until: docker_ps.rc == 0 and docker_ps.stdout | length > 0
      when: docker_bin.stat.exists
