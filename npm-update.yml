---
# Weekly OS update for managed Debian VMs (one host at a time)
- name: Update managed VMs
  hosts: all
  serial: 1
  become: true
  tasks:
    - name: Update apt cache and apply all upgrades
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        upgrade: dist
        autoremove: true
        autoclean: true
      register: apt_result

    - name: Check whether a reboot is pending
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Report result
      ansible.builtin.debug:
        msg: "Upgrade changed packages: {{ apt_result.changed }}; reboot pending: {{ reboot_flag.stat.exists }}"

    - name: Look for Docker
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_bin

    - name: List running containers
      ansible.builtin.command: 'docker ps --format "{% raw %}{{.Names}} {{.Status}}{% endraw %}"'
      register: docker_ps
      changed_when: false
      when: docker_bin.stat.exists

    - name: Show containers
      ansible.builtin.debug:
        var: docker_ps.stdout_lines
      when: docker_bin.stat.exists
