---
# Read-only diagnostics: why does the reboot module not reboot this host?
- name: Reboot diagnostics
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Collect info
      ansible.builtin.shell: |
        echo "== whoami: $(whoami)"
        echo "== uptime: $(uptime -p)"
        echo "== boot: $(who -b)"
        echo "== shutdown: $(command -v shutdown || echo MISSING)"
        echo "== systemctl: $(command -v systemctl || echo MISSING)"
        echo "== state: $(systemctl is-system-running 2>&1)"
        echo "== inhibitors:"; systemd-inhibit --list --no-pager 2>&1 | head -20
        echo "== pending jobs:"; systemctl list-jobs --no-pager 2>&1 | head -10
        echo "== sudo: $(sudo -n true 2>&1 && echo NOPASSWD_OK)"
        echo "== python: $(python3 --version 2>&1)"
        echo "== docker stop timeouts / containers: $(docker ps -q 2>/dev/null | wc -l) running"
      args:
        executable: /bin/bash
      register: diag
      changed_when: false

    - name: Show
      ansible.builtin.debug:
        var: diag.stdout_lines
